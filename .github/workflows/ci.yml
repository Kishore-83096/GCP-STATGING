name: CI Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Run Backend Tests (Flask)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build --target backend -t monorepo-backend .

      - name: Run Backend Tests in Docker
        run: docker run --rm monorepo-backend python -m pytest

  test-frontend:
    name: Run Frontend Tests (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Frontend Image
        run: docker build --target frontend -t monorepo-frontend .

      - name: Run Frontend Tests in Docker
        env:
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL || 'http://localhost:5000' }}
        run: docker run --rm -e REACT_APP_BACKEND_URL="$REACT_APP_BACKEND_URL" monorepo-frontend npm test -- --runInBand

  secret-scan:
    name: Scan for Exposed Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Full Repository History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Repository with Gitleaks in Docker
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:latest detect --source=/repo --redact --verbose --exit-code 1
