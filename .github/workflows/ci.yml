name: CI Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend Lint, Tests, and Build Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Backend Checks in Docker
        run: docker build --target backend -t monorepo-backend .

  frontend-ci:
    name: Frontend Lint, Tests, and Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint Frontend
        run: npm run lint
        working-directory: frontend

      - name: Test Frontend
        run: npm test -- --watchAll=false --runInBand
        working-directory: frontend

      - name: Build Static Frontend
        run: npm run build
        working-directory: frontend

  secret-scan:
    name: Scan for Exposed Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Full Repository History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Repository with Gitleaks in Docker
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:latest detect --source=/repo --redact --verbose --exit-code 1

  ci:
    name: CI Complete
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci
      - secret-scan
    steps:
      - name: Confirm all CI checks passed
        run: echo "All CI checks passed."

  deploy-production:
    name: Deploy to Render Production
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Trigger approved Render deployments
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_BACKEND_SERVICE_ID: ${{ vars.RENDER_BACKEND_SERVICE_ID }}
          RENDER_FRONTEND_SERVICE_ID: ${{ vars.RENDER_FRONTEND_SERVICE_ID }}
        run: |
          set -euo pipefail
          for service_id in "$RENDER_BACKEND_SERVICE_ID" "$RENDER_FRONTEND_SERVICE_ID"; do
            response=$(curl --fail-with-body --silent --show-error \
              --request POST "https://api.render.com/v1/services/${service_id}/deploys" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Content-Type: application/json" \
              --data "{\"commitId\":\"${GITHUB_SHA}\"}")
            deploy_id=$(printf '%s' "$response" | jq -r '.id')
            test -n "$deploy_id" && test "$deploy_id" != "null"
            echo "Triggered Render deploy ${deploy_id} for service ${service_id}."
          done
