name: CI Test Pipeline

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ production ]

jobs:
  backend-ci:
    name: Backend Lint, Tests, and PostgreSQL Auth Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zylo_test
          POSTGRES_USER: zylo
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zylo -d zylo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Backend Checks in Docker
        run: |
          set -euo pipefail
          docker build --target backend -t monorepo-backend .
          docker run --rm --network host \
            --env DATABASE_URL='postgresql+psycopg://zylo:ci_test_password@127.0.0.1:5432/zylo_test' \
            monorepo-backend python -m pytest

  frontend-ci:
    name: Frontend Lint, Tests, and Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint Frontend
        run: npm run lint
        working-directory: frontend

      - name: Test Frontend
        run: npm test -- --watchAll=false --runInBand
        working-directory: frontend

      - name: Build Static Frontend
        run: npm run build
        working-directory: frontend

  secret-scan:
    name: Scan for Exposed Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Full Repository History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Repository with Gitleaks in Docker
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:latest detect --source=/repo --redact --verbose --exit-code 1

  test:
    name: CI Complete
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci
      - secret-scan
    steps:
      - name: Confirm all CI checks passed
        run: echo "All CI checks passed."

  deploy:
    name: Deploy to Render Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'
    environment:
      name: production
    steps:
      - name: Trigger approved Render deployments
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_BACKEND_SERVICE_ID: ${{ vars.RENDER_BACKEND_SERVICE_ID }}
          RENDER_FRONTEND_SERVICE_ID: ${{ vars.RENDER_FRONTEND_SERVICE_ID }}
        run: |
          set -euo pipefail
          for service_id in "$RENDER_BACKEND_SERVICE_ID" "$RENDER_FRONTEND_SERVICE_ID"; do
            if [[ -z "$service_id" || "$service_id" == "null" ]]; then
              echo "A Render service ID is missing. Set both production environment variables: RENDER_BACKEND_SERVICE_ID and RENDER_FRONTEND_SERVICE_ID." >&2
              exit 1
            fi

            response_file=$(mktemp)
            http_status=$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST "https://api.render.com/v1/services/${service_id}/deploys" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Content-Type: application/json" \
              --data "{\"commitId\":\"${GITHUB_SHA}\"}")

            if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]]; then
              echo "Render rejected the deploy request for service ${service_id} (HTTP ${http_status}):" >&2
              jq -r '.message // .error // .' "$response_file" >&2 || cat "$response_file" >&2
              rm -f "$response_file"
              exit 1
            fi

            deploy_id=$(jq -r '.id // empty' "$response_file")
            rm -f "$response_file"
            test -n "$deploy_id" && test "$deploy_id" != "null"
            echo "Triggered Render deploy ${deploy_id} for service ${service_id}."
          done
